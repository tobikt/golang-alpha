name: Implementation ticket
description: Create an actionable implementation ticket derived from plan.md
title: "[TICKET-ID] "
labels: []
body:
  - type: input
    id: ticket_id
    attributes:
      label: Ticket ID
      description: Use the identifier from plan.md, for example DB-010.
      placeholder: DB-010
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Problem and intended outcome
      description: Explain the current problem and the observable result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Phrase each criterion as an observable result.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and phase
      description: List prerequisite tickets and the plan.md milestone or phase.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List exact commands or manual checks.
      value: |
        - `gofmt -w .`
        - `go vet ./...`
        - `go test ./...`
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Go learning objective
      description: Include a Python comparison where it is genuinely helpful.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Security, migration, operations, and documentation notes
      description: State relevant considerations or explicitly write "None".
    validations:
      required: true
